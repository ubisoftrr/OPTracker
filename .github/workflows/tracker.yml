name: OP17 Tracker

on:
  schedule:
    # Alle 10 Minuten. Cron ist in UTC.
    # Achtung: GitHub garantiert keine exakte Minute, kann sich um ein paar
    # Minuten verzögern, besonders bei viel Last auf GitHub Actions.
    # Der eigentliche zuverlässige Trigger läuft über cron-job.org (extern),
    # dieser interne GitHub-Zeitplan ist nur ein Backup.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # erlaubt manuelles Auslösen über den "Run workflow" Button

# Verhindert, dass zwei Läufe gleichzeitig laufen und sich beim
# "state.json"-Commit gegenseitig ins Gehege kommen. Ein neuer Lauf
# bricht einen älteren, noch laufenden automatisch ab, statt sich
# endlos in die Warteschlange zu stellen.
concurrency:
  group: op17-tracker-v2
  cancel-in-progress: true

# Damit der Workflow den aktualisierten Status zurück ins Repo committen darf
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Tracker ausführen
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py --once

      - name: Status committen (state.json)
        run: |
          git config user.name "op17-tracker-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Status-Update [skip ci]"
          git push
