name: OP17 Tracker

on:
  # WICHTIG: Bewusst KEIN eigener "schedule"-Trigger mehr hier! Der lief
  # parallel zum externen cron-job.org-Trigger und hat dadurch alle ~10 Min.
  # zwei Läufe fast gleichzeitig gestartet, die sich gegenseitig per
  # Concurrency-Regel abgebrochen/gekillt haben -> abgebrochene/fehlgeschla-
  # gene Läufe und dadurch inkonsistente state.json-Stände samt Fehlalarmen.
  # Der einzige Trigger ist jetzt cron-job.org (ruft workflow_dispatch auf).
  workflow_dispatch: {}   # erlaubt manuelles Auslösen (Button + cron-job.org)

# Verhindert, dass zwei Läufe gleichzeitig laufen und sich beim
# "state.json"-Commit gegenseitig ins Gehege kommen. Ein neuer Lauf
# bricht einen älteren, noch laufenden automatisch ab.
concurrency:
  group: op17-tracker-v2
  cancel-in-progress: true

# Damit der Workflow den aktualisierten Status zurück ins Repo committen darf
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Tracker ausführen
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py --once

      - name: Status committen (state.json)
        run: |
          git config user.name "op17-tracker-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Status-Update [skip ci]"
          git push
